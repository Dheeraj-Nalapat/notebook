<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Notes</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
</head>

<body class="theme-light">
  <div class="container">
    <header class="header">
      <div class="header-content">
        <h1 class="header-title">My Notes</h1>
        <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme">
          <svg class="theme-icon theme-icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
          <svg class="theme-icon theme-icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>
      </div>
    </header>

    <div class="main-content">
      <aside class="sidebar">
        <div class="search-box">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.35-4.35"></path>
          </svg>
          <input type="text" id="searchInput" placeholder="Search notes...">
        </div>

        <div id="sidebarContent" class="sidebar-content">
          <div class="folder-section main-section">
            <div class="folder-header main-header">
              <span class="folder-toggle">▼</span>
              <h2>Agent Reports</h2>
            </div>
            <ul id="agentReportsList" class="file-list"></ul>
          </div>

          <div class="folder-section main-section">
            <div class="folder-header main-header">
              <span class="folder-toggle">▼</span>
              <h2>Brain</h2>
            </div>
            <ul id="brainList" class="file-list"></ul>
          </div>
        </div>
      </aside>

      <main class="content-area">
        <div id="loading" class="loading hidden">Loading...</div>
        <div id="error" class="error hidden"></div>
        <div id="markdownContent" class="markdown-content"></div>
        <div id="emptyState" class="empty-state">
          <p>Select a file to view its content</p>
        </div>
      </main>
    </div>
  </div>

  <script src="app.js"></script>
</body>

</html>
